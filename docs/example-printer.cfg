# loxklipper - example sections for printer.cfg
#
# Every value here is made up. Replace the addresses, names and credentials
# with your own before using any of it.

# --------------------------------------------------------------------------
# Matches the shipped Loxone project, docs/example.Loxone
# --------------------------------------------------------------------------
# There, the Virtual Text Input is named "api" and a "Pulse At" block set
# to "sw1" toggles a switch. So this sends:
#   POST http://192.168.1.10/dev/sps/io/api/sw1
#
# Note it toggles: LOXONE NAME=relay twice switches on, then off again.

[loxone relay]
loxone_ip: 192.168.1.10
user: klipper
password: changeme
vi_name: api
text_send: sw1

# --------------------------------------------------------------------------
# Deterministic on and off through one section
# --------------------------------------------------------------------------
# Two "Pulse At" blocks on the same text input, one matching "light_on" and
# one "light_off", wired to the switch's On and Off inputs instead of Tg.
# text_send is the default; VALUE= reaches the other one.
#
#   LOXONE NAME=printer_light                  -> .../api/light_on
#   LOXONE NAME=printer_light VALUE=light_off  -> .../api/light_off

[loxone printer_light]
loxone_ip: 192.168.1.10
user: klipper
password: changeme
vi_name: api
text_send: light_on

# --------------------------------------------------------------------------
# The same target in the camelCase spelling - both are accepted
# --------------------------------------------------------------------------
# Klipper lower-cases option names before a module sees them, so loxoneIP and
# loxone_ip end up as the same option. Pick one style and stay with it.

[loxone bedroom_tv]
user: klipper
passwort: changeme
loxoneIP: 192.168.1.10
viName: FLOOR-API
textSend: BR-TV-ON
waittime: 120        # wait 120s, THEN send. The print carries on meanwhile.

# --------------------------------------------------------------------------
# Everything the module understands
# --------------------------------------------------------------------------

[loxone workshop_fan]
loxone_ip: 192.168.1.10      # host or IP; a port goes here as host:8080
protocol: http               # http (default) or https
verify_certificate: True     # https only; False for a self-signed certificate
user: klipper
password: changeme
vi_name: WORKSHOP-API
text_send: WS-FAN-ON
wait_time: 30                # seconds to wait BEFORE sending; 0 sends at once
wait_mode: defer             # defer (default) = print continues during the wait
                             # block = hold the G-code stream until it is sent
method: POST                 # POST (default) or GET
timeout: 5                   # seconds per HTTP attempt
retries: 2                   # extra attempts after a failure, 1s apart
on_error: log                # log (default) | pause | abort

# --------------------------------------------------------------------------
# Using it from macros
# --------------------------------------------------------------------------

[gcode_macro PRINT_START]
gcode:
    LOXONE NAME=printer_light
    LOXONE NAME=workshop_fan
    # ... your usual homing / heating ...

[gcode_macro PRINT_END]
gcode:
    # ... your usual retract / park ...
    LOXONE NAME=workshop_fan VALUE=WS-FAN-OFF
    LOXONE NAME=printer_light VALUE=light_off WAIT=0

# Delayed switching: the call returns at once, the request goes out later.
# Handy in PRINT_START - "turn the light on once the first layer is down".
[gcode_macro LIGHT_ON_LATER]
gcode:
    LOXONE NAME=printer_light WAIT=180

# Only wait_mode: block stops the toolhead with a hot nozzle. If you really
# need the G-code stream held mid-print, park and retract first. This assumes
# the target is configured with wait_mode: block - with the default defer the
# parking is pointless, because the print never stops in the first place.
[gcode_macro TV_ON_PARKED]
gcode:
    SAVE_GCODE_STATE NAME=tv_on
    G91
    G1 Z5 F600
    G90
    G1 X10 Y10 F6000
    LOXONE NAME=bedroom_tv
    RESTORE_GCODE_STATE NAME=tv_on MOVE=1

# Drop anything still scheduled - e.g. in CANCEL_PRINT
[gcode_macro CANCEL_LOXONE]
gcode:
    LOXONE_CANCEL
