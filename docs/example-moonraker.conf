# loxklipper - Moonraker update block
#
# install.sh appends this to moonraker.conf automatically when it finds the
# file and no block is present yet. Add it by hand if you installed manually
# or if your moonraker.conf lives somewhere the installer did not look.
#
# Adjust "path" if you cloned somewhere other than ~/loxklipper.

[update_manager loxklipper]
type: git_repo
path: ~/loxklipper
origin: https://github.com/sorglos-it/loxklipper.git
primary_branch: main
managed_services: klipper
install_script: install.sh

# managed_services: klipper makes Moonraker restart Klipper after an update,
# which is what actually loads the new module.
#
# install.sh is re-run after every pull. It is non-interactive and idempotent:
# it refreshes the symlink and leaves an existing update block alone, so an
# update never waits for a password prompt that nobody can answer.
#
# Restart Moonraker once after adding this block:
#   sudo systemctl restart moonraker
